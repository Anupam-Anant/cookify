<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Reset Password · COOKify</title>
  <link rel="stylesheet" th:href="@{/css/cookify.css}"/></head>
<body>
<header class="ck-header"><a class="ck-logo" th:href="@{/}">COOK<span>ify</span> 🧑‍🍳</a><div th:replace="~{layout :: langSwitcher}"></div></header>
<main class="ck-main">
  <h1 style="text-align:center">Set a New Password</h1>
  <div th:if="${param.sent}">If the account exists, a reset code has been emailed.</div>
  <div class="ck-error" th:if="${error}" th:text="${error}"></div>
  <form class="ck-form" method="post" th:action="@{/password/reset}">
    <input type="text" name="identifier" placeholder="Username / Email / Phone Number"/>
    <input type="text" name="code" placeholder="6-digit code" maxlength="6"/>
    <input type="password" name="newPassword" placeholder="New Password"/>
    <button class="ck-btn" type="submit">Confirm New Password</button>
  </form>
</main>
</body>
</html>
