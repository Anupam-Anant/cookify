spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cookify}
    username: ${DB_USER:cookify}
    password: ${DB_PASSWORD:cookify}
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
cookify:
  remember-me:
    # NO default -- prod MUST set COOKIFY_REMEMBER_ME_KEY (startup fails fast otherwise).
    key: ${COOKIFY_REMEMBER_ME_KEY}
